[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-vision"
version = "1.3.0"
description = "The first on-device enterprise vision system that is GDPR-compliant by design, not by policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Karthik Barma", email = "karthik@thebarmaeffect.dev" }
]
keywords = [
    "computer-vision",
    "yolo",
    "yolo26",
    "mlx",
    "apple-silicon",
    "privacy",
    "gdpr",
    "ccpa",
    "hipaa",
    "constitutional-ai",
    "on-device",
    "enterprise",
    "glass-box",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "Pillow>=10.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.18"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
metrics = ["prometheus-client>=0.21"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/TheBarmaEffect/sovereign-vision"
Repository = "https://github.com/TheBarmaEffect/sovereign-vision"
Issues = "https://github.com/TheBarmaEffect/sovereign-vision/issues"
Research = "https://github.com/TheBarmaEffect"

[project.scripts]
sovereign-vision = "demo.run_demo:main"
sovereign = "sovereign.cli:main"

[tool.setuptools]
packages = ["sovereign", "dashboard", "dashboard.panels", "demo", "demo.scenarios"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "constitutional: marks tests as constitutional zero-PII proofs",
]
